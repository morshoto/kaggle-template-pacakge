name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  go-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli/get_discussion
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: cli/get_discussion/go.mod
          cache-dependency-path: cli/get_discussion/go.sum
      - run: go test ./...

  notebook-json:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate starter notebook JSON
        run: python -m json.tool notebooks/exploration/exp-001-data.ipynb > /dev/null
